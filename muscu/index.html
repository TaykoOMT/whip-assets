<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Muscu</title>
<meta name="description" content="Carnet de musculation : note tes séries, tes répétitions et tes charges.">
<meta name="theme-color" content="#0b0f17">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Muscu">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>
  :root {
    --bg: #0b0f17;
    --surface: #151b26;
    --surface-2: #1d2533;
    --border: #2a3444;
    --text: #eef2f8;
    --muted: #8b97ab;
    --accent: #4aa8ff;
    --accent-ink: #04121f;
    --danger: #ff6b6b;
    --gold: #ffc542;
    --radius: 16px;
  }
  @media (prefers-color-scheme: light) {
    :root {
      --bg: #f3f5f9;
      --surface: #ffffff;
      --surface-2: #eef1f6;
      --border: #d9dee7;
      --text: #111722;
      --muted: #5f6b7d;
      --accent: #1f7ae0;
      --accent-ink: #ffffff;
      --danger: #d64545;
      --gold: #b8860b;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; }
  body {
    background: var(--bg);
    color: var(--text);
    font: 16px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    overscroll-behavior-y: none;
  }
  button, input, select { font: inherit; color: inherit; }
  button { cursor: pointer; border: 0; background: none; padding: 0; }

  header {
    position: sticky; top: 0; z-index: 5;
    background: var(--bg);
    padding: calc(env(safe-area-inset-top) + 12px) 16px 10px;
    display: flex; align-items: center; gap: 10px;
    min-height: 56px;
  }
  header h1 {
    font-size: 21px; line-height: 1.2; margin: 0; flex: 1; min-width: 0;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }
  header .timer { flex: none; }
  .back { font-size: 26px; width: 40px; height: 40px; margin-left: -8px; border-radius: 12px; }
  .back:active { background: var(--surface); }

  main {
    padding: 0 16px calc(env(safe-area-inset-bottom) + 96px);
    max-width: 560px; margin: 0 auto;
  }

  nav {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
    display: grid; grid-template-columns: repeat(5, 1fr);
    background: var(--surface);
    border-top: 1px solid var(--border);
    padding-bottom: env(safe-area-inset-bottom);
  }
  nav button {
    padding: 8px 0 10px; display: flex; flex-direction: column; align-items: center; gap: 2px;
    font-size: 11px; color: var(--muted); white-space: nowrap;
  }
  nav button svg { width: 24px; height: 24px; }
  nav button[aria-current="page"] { color: var(--accent); }

  .card {
    background: var(--surface); border: 1px solid var(--border);
    border-radius: var(--radius); padding: 14px; margin-bottom: 12px;
  }
  .muted { color: var(--muted); }
  .small { font-size: 14px; }
  .section-title { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; }

  .search {
    width: 100%; padding: 14px 16px; border-radius: 14px;
    background: var(--surface); border: 1px solid var(--border); outline: none;
  }
  .search:focus { border-color: var(--accent); }

  .list { display: flex; flex-direction: column; gap: 8px; margin-top: 12px; }
  .row {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 14px; padding: 14px;
  }
  .row:active { background: var(--surface-2); }
  .row .grow { flex: 1; min-width: 0; }
  .row .title { font-weight: 600; }
  .row .sub { font-size: 14px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .chev { color: var(--muted); font-size: 20px; }
  .badge {
    background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 13px;
    border-radius: 999px; padding: 2px 9px;
  }
  .row.add { border-style: dashed; color: var(--accent); font-weight: 600; justify-content: center; }

  .steppers { display: grid; grid-template-columns: 1fr; gap: 10px; }
  .stepper { background: var(--surface-2); border-radius: 14px; padding: 10px; text-align: center; }
  .stepper label { display: block; font-size: 13px; color: var(--muted); margin-bottom: 6px; }
  .stepper .ctrl { display: flex; align-items: center; justify-content: space-between; gap: 4px; }
  .stepper button {
    width: 60px; height: 52px; border-radius: 12px; flex: none;
    background: var(--surface); border: 1px solid var(--border);
    font-size: 24px; line-height: 1;
  }
  .stepper button:active { background: var(--accent); color: var(--accent-ink); }
  .stepper input {
    width: 100%; min-width: 0; text-align: center; font-size: 34px; font-weight: 700;
    background: none; border: 0; outline: none; padding: 0;
    font-variant-numeric: tabular-nums;
  }
  .primary {
    display: block; width: 100%; margin-top: 12px;
    background: var(--accent); color: var(--accent-ink);
    font-weight: 700; font-size: 18px; padding: 16px; border-radius: 14px;
  }
  .primary:active { filter: brightness(.9); }
  .secondary {
    display: block; width: 100%; padding: 14px; border-radius: 14px; margin-top: 8px;
    background: var(--surface); border: 1px solid var(--border); font-weight: 600;
  }
  .danger { color: var(--danger); }

  .last { font-size: 14px; color: var(--muted); margin: 0 4px 12px; }
  .last b { color: var(--text); font-weight: 600; }

  .sets { display: flex; flex-direction: column; gap: 6px; }
  .set {
    display: flex; align-items: center; gap: 12px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 12px; padding: 10px 6px 10px 14px;
  }
  .set .n { width: 22px; color: var(--muted); font-weight: 600; font-variant-numeric: tabular-nums; }
  .set .v { flex: 1; font-size: 18px; font-weight: 600; font-variant-numeric: tabular-nums; }
  .set .pr { color: var(--gold); font-size: 13px; font-weight: 700; margin-left: 6px; }
  .set .x { width: 40px; height: 40px; border-radius: 10px; color: var(--muted); font-size: 20px; }
  .set .x:active { background: var(--surface-2); color: var(--danger); }

  .timer[hidden] { display: none; }
  .timer {
    display: inline-flex; align-items: center; gap: 6px;
    background: var(--surface); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 12px; font-size: 14px; font-variant-numeric: tabular-nums;
  }

  .day h3 { margin: 0 0 8px; font-size: 16px; }
  .day .ex { padding: 8px 0; border-top: 1px solid var(--border); }
  .day .ex:first-of-type { border-top: 0; padding-top: 0; }
  .day .ex .name { font-weight: 600; }
  .day .ex .detail { font-size: 15px; color: var(--muted); font-variant-numeric: tabular-nums; }

  .stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-bottom: 12px; }
  .stat { background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 12px 8px; text-align: center; }
  .stat .k { font-size: 12px; color: var(--muted); }
  .stat .val { font-size: 20px; font-weight: 700; font-variant-numeric: tabular-nums; }

  select.search { appearance: none; -webkit-appearance: none; }
  .chart svg { width: 100%; height: auto; display: block; }
  .chart .line { fill: none; stroke: var(--accent); stroke-width: 2.5; stroke-linejoin: round; stroke-linecap: round; }
  .chart .dot { fill: var(--accent); }
  .chart .grid { stroke: var(--border); stroke-width: 1; }
  .chart text { fill: var(--muted); font-size: 10px; }

  .empty { text-align: center; color: var(--muted); padding: 40px 16px; }
  .empty .big { font-size: 44px; margin-bottom: 8px; }

  .toast {
    position: fixed; left: 50%; bottom: calc(env(safe-area-inset-bottom) + 84px);
    transform: translateX(-50%) translateY(20px); opacity: 0;
    background: var(--text); color: var(--bg); font-weight: 600;
    padding: 10px 18px; border-radius: 999px; pointer-events: none;
    transition: opacity .2s, transform .2s; z-index: 20;
    width: max-content; max-width: calc(100% - 32px); text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .seg { display: flex; background: var(--surface-2); border-radius: 12px; padding: 3px; gap: 3px; }
  .seg button { flex: 1; padding: 8px 0; border-radius: 10px; font-weight: 600; color: var(--muted); }
  .seg button[aria-pressed="true"] { background: var(--surface); color: var(--text); box-shadow: 0 1px 2px rgba(0,0,0,.2); }
  .setting-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  .ex-edit { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-top: 1px solid var(--border); }
  .ex-edit:first-child { border-top: 0; }
  .ex-edit span { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .ex-edit button { padding: 8px 10px; border-radius: 10px; font-size: 14px; color: var(--muted); }
  .ex-edit button:active { background: var(--surface-2); }
  .ex-edit select { background: var(--surface-2); border: 1px solid var(--border); border-radius: 8px; padding: 6px 4px; font-size: 13px; }

  .timer.ready { background: #1f9d55; border-color: #1f9d55; color: #fff; font-weight: 700; }

  /* Programmes */
  .prog .title { font-weight: 700; font-size: 18px; }
  .prog-head { display: flex; align-items: flex-start; gap: 10px; }
  .prog-head .grow { flex: 1; min-width: 0; }
  .prog-ex { font-size: 14px; color: var(--muted); margin-top: 8px; }
  .link { color: var(--accent); font-weight: 600; font-size: 15px; padding: 4px 2px; }
  .note { font-size: 14px; color: var(--muted); margin: 0 4px 12px; }
  .progress { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 4px 0 6px; }
  .progress > div { height: 100%; background: var(--accent); border-radius: 999px; transition: width .3s; }
  .step {
    width: 30px; height: 30px; border-radius: 50%; flex: none;
    display: inline-flex; align-items: center; justify-content: center;
    background: var(--surface-2); color: var(--muted); font-weight: 700; font-size: 14px;
  }
  .step.ok { background: #1f9d55; color: #fff; }
  .count { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--muted); }
  .count.ok { color: #1f9d55; }
  .target { margin: 0 4px 6px; font-size: 15px; }
  .target b { font-weight: 700; }
  .tip { font-size: 14px; color: var(--muted); margin: 0 4px 6px; }
  .field {
    width: 100%; padding: 10px 12px; border-radius: 10px;
    background: var(--surface-2); border: 1px solid var(--border); outline: none;
  }
  .field:focus { border-color: var(--accent); }
  textarea.field { resize: vertical; font: inherit; }
  .lbl { display: block; font-size: 13px; color: var(--muted); margin: 10px 0 4px; }
  .lbl:first-child { margin-top: 0; }
  .item-head { display: flex; align-items: center; gap: 10px; }
  .item-grid { display: grid; grid-template-columns: 70px 1fr 1fr; gap: 8px; margin-top: 8px; }
  .item-grid label { font-size: 12px; color: var(--muted); }
  .item-grid .field { margin-top: 3px; padding: 8px 10px; }
  .item-actions { display: flex; gap: 6px; margin-top: 8px; }
  .item-actions button { padding: 8px 12px; border-radius: 10px; background: var(--surface-2); font-size: 14px; }
  .item-actions .danger { margin-left: auto; }

  /* Suggestion de charge */
  .suggest {
    margin: 0 0 12px; padding: 10px 12px; border-radius: 12px; font-size: 14px;
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  }

  /* Chrono des exercices en durée */
  .chrono { text-align: center; }
  .chrono-time { font-size: 72px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; margin: 6px 0 10px; }
  .progress.big { height: 12px; margin-bottom: 4px; }

  /* Résumé de séance */
  .hero { text-align: center; padding: 18px 14px; }
  .hero .big { font-size: 40px; }
  .hero .title { font-size: 20px; font-weight: 800; margin: 4px 0 2px; }
  .delta { font-size: 12px; font-weight: 600; color: var(--muted); margin-top: 2px; }
  .delta.up { color: #1f9d55; }
  .delta.down { color: var(--danger); }
  .arrow { font-weight: 800; margin-left: 6px; }
  .arrow.up { color: #1f9d55; }
  .arrow.down { color: var(--danger); }
  .card ul { margin: 6px 0 0; padding-left: 20px; }

  /* Badges */
  .badges { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .badge-tile {
    background: var(--surface); border: 1px solid var(--border); border-radius: 14px;
    padding: 10px 6px; text-align: center; min-width: 0;
  }
  .badge-tile.ok { border-color: color-mix(in srgb, var(--gold) 60%, var(--border)); }
  .badge-tile .bi { font-size: 30px; line-height: 1.2; filter: grayscale(1); opacity: .35; }
  .badge-tile.ok .bi { filter: none; opacity: 1; }
  .badge-tile .bn { font-weight: 700; font-size: 13px; line-height: 1.2; margin-top: 4px; }
  .badge-tile .bd { font-size: 11px; line-height: 1.25; color: var(--muted); margin-top: 2px; }
  .badge-tile .bp { font-size: 11px; font-weight: 600; color: var(--muted); margin-top: 4px; }
  .badge-tile .bp.ok { color: var(--gold); }
  .badge-tile .bar { height: 4px; background: var(--surface-2); border-radius: 999px; margin-top: 6px; overflow: hidden; }
  .badge-tile .bar > div { height: 100%; background: var(--accent); }
  /* Thèmes de couleur débloqués avec les niveaux */
  :root[data-accent="green"] { --accent: #3ddc84; --accent-ink: #04170c; }
  :root[data-accent="violet"] { --accent: #b197fc; --accent-ink: #14072e; }
  :root[data-accent="red"] { --accent: #ff6b6b; --accent-ink: #2a0505; }
  @media (prefers-color-scheme: light) {
    :root[data-accent="green"] { --accent: #16a34a; --accent-ink: #ffffff; }
    :root[data-accent="violet"] { --accent: #7c3aed; --accent-ink: #ffffff; }
    :root[data-accent="red"] { --accent: #dc2626; --accent-ink: #ffffff; }
  }
  :root[data-accent="gold"] {
    --bg: #000000; --surface: #0f0f0f; --surface-2: #1a1a1a; --border: #2e2918;
    --text: #f6f1e3; --muted: #a39c86; --accent: #f5c542; --accent-ink: #1a1200;
    --danger: #ff6b6b; --gold: #f5c542;
  }

  /* Profil, niveaux, récompenses */
  .avatar {
    width: 56px; height: 56px; border-radius: 50%; flex: none; font-size: 34px;
    display: flex; align-items: center; justify-content: center; background: var(--surface-2);
  }
  .hero .avatar { width: 72px; height: 72px; font-size: 44px; margin: 0 auto 6px; }
  .xpbar { height: 8px; background: var(--surface-2); border-radius: 999px; overflow: hidden; margin: 6px 0 4px; }
  .xpbar > div { height: 100%; border-radius: 999px; background: linear-gradient(90deg, var(--accent), var(--gold)); }
  .xp-gain { font-size: 22px; font-weight: 800; color: var(--accent); margin-top: 8px; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    padding: 8px 12px; border-radius: 999px; font-size: 14px; font-weight: 600;
    background: var(--surface-2); border: 1px solid var(--border);
  }
  .chip[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
  .chip.locked, .swatch.locked, .av.locked { opacity: .4; }
  .swatches { display: flex; flex-wrap: wrap; gap: 12px; }
  .swatch { width: 56px; text-align: center; font-size: 11px; color: var(--muted); }
  .swatch .dot {
    width: 44px; height: 44px; border-radius: 50%; margin: 0 auto 4px; border: 3px solid transparent;
    display: flex; align-items: center; justify-content: center; font-size: 15px;
  }
  .swatch[aria-pressed="true"] .dot { border-color: var(--text); }
  .avatars { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
  .av { font-size: 26px; padding: 6px 0; border-radius: 12px; background: var(--surface-2); border: 2px solid transparent; }
  .av[aria-pressed="true"] { border-color: var(--accent); }
  .av.locked { filter: grayscale(1); }
  .challenge { padding: 10px 0; border-top: 1px solid var(--border); }
  .challenge:first-of-type { border-top: 0; padding-top: 4px; }
  .challenge .top { display: flex; justify-content: space-between; gap: 8px; font-size: 15px; }
  .challenge .xp { font-weight: 700; color: var(--accent); white-space: nowrap; }
  .challenge.ok .top span:first-child { text-decoration: line-through; color: var(--muted); }
  .lvl-row { display: flex; gap: 10px; padding: 8px 0; border-top: 1px solid var(--border); font-size: 14px; }
  .lvl-row:first-of-type { border-top: 0; }
  .lvl-row .lv { width: 52px; flex: none; font-weight: 700; color: var(--muted); }
  .lvl-row.ok .lv { color: var(--accent); }
  .lvl-row.ok { color: var(--muted); }
  .lvl-row.next { font-weight: 600; }
  .emom-min { font-size: 22px; font-weight: 800; margin-top: 4px; }
  .fx { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; z-index: 30; }
  .card h4 { margin: 0 0 10px; font-size: 16px; }
  .badge-icons { font-size: 22px; letter-spacing: 2px; white-space: nowrap; overflow: hidden; }
  .card li { margin: 4px 0; }
</style>
</head>
<body>
<header>
  <button class="back" id="back" hidden aria-label="Retour">‹</button>
  <h1 id="title">Séance</h1>
  <span id="timer" class="timer" hidden></span>
</header>
<main id="app"></main>
<nav>
  <button data-tab="seance" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 7v10M3 9v6M18 7v10M21 9v6M6 12h12"/></svg>
    Séance
  </button>
  <button data-tab="programmes">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 4V3h6v1M9 10h6M9 14h6M9 18h3"/></svg>
    Programmes
  </button>
  <button data-tab="historique">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="3"/><path d="M3 9h18M8 2v4M16 2v4"/></svg>
    Historique
  </button>
  <button data-tab="progres">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8M15 7h6v6"/></svg>
    Progrès
  </button>
  <button data-tab="reglages">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    Réglages
  </button>
</nav>
<div class="toast" id="toast"></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>

<script>
'use strict';

// ---------- Données ----------
const STORE_KEY = 'muscu.v1';
const DEFAULT_EXERCISES = [
  'Développé couché', 'Squat', 'Soulevé de terre', 'Développé militaire',
  'Tractions', 'Rowing barre', 'Développé incliné haltères', 'Curl biceps',
  'Extension triceps poulie', 'Presse à cuisses', 'Élévations latérales',
  'Dips', 'Fentes', 'Tirage vertical', 'Leg curl', 'Mollets debout'
];

// Programmes de départ : [exercice, séries, objectif, repos, type, conseil]
// type : 'reps' (défaut), 's' (durée en secondes) ou 'min' (durée en minutes)
const SEED_PROGRAMS = [

function uid() { return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }
const norm = s => String(s).toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').trim();

function findOrCreateEx(d, name, kind) {
  let ex = d.exercises.find(e => norm(e.name) === norm(name));
  if (!ex) { ex = { id: uid(), name }; d.exercises.push(ex); }
  if (kind && kind !== 'reps' && !ex.kind) ex.kind = kind;
  return ex;
}

// Met à niveau une base (ancienne version, import…) vers le format actuel
function migrate(d) {
  d.settings = Object.assign({ step: 2.5 }, d.settings);
  const build = sp => ({
    id: uid(), name: sp.name, note: sp.note,
    items: sp.items.map(([n, sets, target, rest, kind, tip, mode]) =>
      Object.assign({ exId: findOrCreateEx(d, n, kind).id, sets, target, rest, tip: tip || '' }, mode ? { mode } : {}))
  });
  if (!Array.isArray(d.programs)) d.programs = SEED_PROGRAMS.map(build);
  if (!Array.isArray(d.runs)) d.runs = [];
  if (!d.badges || typeof d.badges !== 'object') d.badges = {};
  if (!d.challenges || typeof d.challenges !== 'object') d.challenges = {};
  if (!Array.isArray(d.jokersUsed)) d.jokersUsed = [];
  if (!d.profile || typeof d.profile !== 'object') d.profile = {};
  if (d.active && (Date.now() - d.active.start > 12 * 3600e3 || !d.programs.some(p => p.id === d.active.progId))) d.active = null;
  if ((d.v || 1) < 3) {
    // Séance B : les fentes (polyarticulaire) passent avant le leg curl (isolation),
    // sauf si l'utilisateur a déjà changé l'ordre lui-même
    const name = id => norm((d.exercises.find(e => e.id === id) || {}).name || '');
    for (const p of d.programs) {
      const i = p.items.findIndex(it => name(it.exId) === norm('Leg curl assis'));
      if (i >= 0 && p.items[i + 1] && name(p.items[i + 1].exId) === norm('Fentes arrière')) {
        [p.items[i], p.items[i + 1]] = [p.items[i + 1], p.items[i]];
      }
    }
  }
  d.settings = Object.assign({ sound: true, awake: true }, d.settings);
  if ((d.v || 1) < 4) {
    // Ajout des séances D1 (footing) et D2 (fractionné) aux installations existantes
    for (const sp of SEED_PROGRAMS.filter(x => /^Séance D/.test(x.name))) {
      if (!d.programs.some(p => norm(p.name) === norm(sp.name))) d.programs.push(build(sp));
    }
  }
  if ((d.v || 1) < 5) {
    // Séance C : tractions en EMOM 8 min × 3 (si l'utilisateur n'a pas modifié l'exercice)
    const C = d.programs.find(p => norm(p.name) === norm('Séance C — Corps entier et endurance'));
    const it = C && C.items.find(x => norm((d.exercises.find(e => e.id === x.exId) || {}).name || '') === norm('Tractions pronation'));
    if (it && !it.mode && it.sets === 3 && it.target === '3–5') {
      Object.assign(it, { mode: 'emom', sets: 8, target: '3', rest: '', tip: 'EMOM : au début de chaque minute, fais tes tractions, puis repose-toi le reste de la minute. Chaque rep propre : menton au-dessus de la barre, bras tendus en bas.' });
    }
  }
  if ((d.v || 1) < 6) {
    // Séance A : tractions 4 × 4–6 (plage de force avec une rep de marge), si non modifiées
    const A = d.programs.find(p => norm(p.name) === norm('Séance A — Haut du corps'));
    const it = A && A.items.find(x => norm((d.exercises.find(e => e.id === x.exId) || {}).name || '') === norm('Tractions pronation'));
    if (it && !it.mode && it.sets === 4 && it.target === '4–5') it.target = '4–6';
  }
  if ((d.v || 1) < 7) {
    // Point faible bas des pecs : les pompes laissent la place aux dips buste penché.
    // Séance A : dips 3 × 6–10 avant le développé militaire. Séance C : dips 3 × 8–12 à la place des pompes.
    const exName = id => norm((d.exercises.find(e => e.id === id) || {}).name || '');
    const dips = findOrCreateEx(d, 'Dips (buste penché)');
    const swap = (progName, pompesTarget, dipsTarget, rest, beforeName) => {
      const P = d.programs.find(p => norm(p.name) === norm(progName));
      if (!P || P.items.some(it => it.exId === dips.id)) return;
      const i = P.items.findIndex(it => exName(it.exId) === norm('Pompes') && !it.mode && it.target === pompesTarget);
      if (i < 0) return;
      const item = { exId: dips.id, sets: 3, target: dipsTarget, rest, tip: 'Buste penché d’environ 30° vers l’avant, coudes légèrement écartés : c’est ce qui cible le bas des pecs. Descends jusqu’à ce que les épaules arrivent au niveau des coudes. Douleur à l’avant de l’épaule → descends moins bas.' };
      P.items.splice(i, 1);
      const j = beforeName ? P.items.findIndex(it => exName(it.exId) === norm(beforeName)) : -1;
      P.items.splice(j >= 0 ? j : i, 0, item);
    };
    swap('Séance A — Haut du corps', '15–25', '6–10', '2 min', 'Développé militaire haltères');
    swap('Séance C — Corps entier et endurance', '15–20', '8–12', '90 s', null);
  }
  d.v = 7;
  return d;
}

const num = s => { const n = parseFloat(String(s).replace(',', '.')); return isFinite(n) ? n : 0; };
const round2 = n => Math.round(n * 100) / 100;
const fmtNum = n => n.toLocaleString('fr-FR', { maximumFractionDigits: 2 });
const fmtW = w => w > 0 ? fmtNum(w) + ' kg' : 'PDC';
const firstNum = str => { const m = String(str || '').match(/\d+([.,]\d+)?/); return m ? num(m[0]) : 0; };
// "2–3 min" → 120, "90–120 s" → 90
const parseRest = str => { const n = firstNum(str); return /min/.test(str) ? n * 60 : n; };
const mmss = sec => Math.floor(sec / 60) + ':' + String(sec % 60).padStart(2, '0');

const exById = id => db.exercises.find(e => e.id === id);
const kindOf = exId => (exById(exId) || {}).kind || 'reps';
function fmtSetBase(s) {
  const k = kindOf(s.exId);
  if (k !== 'reps') return (s.w > 0 ? fmtNum(s.w) + ' kg · ' : '') + s.r + ' ' + k;
  return (s.w > 0 ? fmtNum(s.w) : 'PDC') + ' × ' + s.r;
}
const fmtSet = s => (s.test ? '🎯 ' : '') + fmtSetBase(s);
// « PDC × 3 · PDC × 3 · PDC × 3 » → « PDC × 3 (×3) »
function fmtSets(list) {
  const groups = [];
  for (const s of list) {
    const f = fmtSet(s), g = groups[groups.length - 1];
    if (g && g.f === f) g.n++; else groups.push({ f, n: 1 });
  }
  return groups.map(g => g.n >= 3 ? `${g.f} (×${g.n})` : Array(g.n).fill(g.f).join(' · ')).join(' · ');
}
const fmtSetLong = s => kindOf(s.exId) === 'reps' ? (s.test ? '🎯 ' : '') + fmtW(s.w) + ' × ' + s.r : fmtSet(s);

function dayKey(t) {
  const d = new Date(t);
  return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0');
}
const todayKey = () => dayKey(Date.now());
function fmtDay(key, opts) {
  const [y, m, d] = key.split('-').map(Number);
  const s = new Date(y, m - 1, d).toLocaleDateString('fr-FR', opts || { weekday: 'long', day: 'numeric', month: 'long' });
  return s.charAt(0).toUpperCase() + s.slice(1);
}
function relDay(key) {
  if (key === todayKey()) return 'aujourd’hui';
  const y = new Date(); y.setDate(y.getDate() - 1);
  if (key === dayKey(y)) return 'hier';
  return fmtDay(key, { day: 'numeric', month: 'short' });
}

const setsOf = exId => db.sets.filter(s => s.exId === exId).sort((a, b) => a.t - b.t);
const e1rm = s => s.w * (1 + s.r / 30); // formule d'Epley

// Séances d'un exercice regroupées par jour (ordre chronologique)
function sessionsOf(exId) {
  const map = new Map();
  for (const s of setsOf(exId)) {
    const k = dayKey(s.t);
    if (!map.has(k)) map.set(k, []);
    map.get(k).push(s);
  }
  return [...map.entries()].map(([day, sets]) => ({ day, sets }));
}

// Programme en cours
const progById = id => db.programs.find(p => p.id === id);
const runSets = exId => db.active ? setsOf(exId).filter(s => s.t >= db.active.start && !s.test) : [];
function progCtx() {
  if (ui.tab !== 'programmes' || !db.active) return null;
  const p = progById(db.active.progId);
  const i = p ? p.items.findIndex(it => it.exId === ui.exId) : -1;
  return i < 0 ? null : { p, i, item: p.items[i] };
}

// Objectif d'un exercice : celui du programme en cours, sinon du premier programme qui le contient
function itemFor(exId) {
  const ctx = progCtx();
  if (ctx && ctx.item.exId === exId) return ctx.item;
  for (const p of db.programs) { const it = p.items.find(i => i.exId === exId); if (it) return it; }
  return null;
}
// "8–12" → { lo: 8, hi: 12 }, "15" → { lo: 15, hi: 15 }
function parseRange(str) {
  const m = String(str || '').match(/(\d+)\s*(?:[–-]\s*(\d+))?/);
  return m ? { lo: +m[1], hi: +(m[2] || m[1]) } : null;
}
// Double progression : si toutes les séries de travail atteignent le haut de la fourchette, on monte la charge
function suggestFor(exId, sets) {
  sets = sets.filter(s => !s.test);
  const it = itemFor(exId);
  const range = it && parseRange(it.target);
  if (!range || kindOf(exId) !== 'reps' || !sets.length) return null;
  const top = Math.max(...sets.map(s => s.w));
  if (it.mode === 'emom') {
    const reps = range.lo;
    if (sets.length < it.sets || sets.slice(0, it.sets).some(s => s.r < reps)) return null;
    if (it.sets < 12) return { w: top, r: reps, text: `EMOM ${it.sets} min × ${reps} réussie → passe à ${it.sets + 1} min.`, apply: { sets: it.sets + 1 }, label: `${it.sets + 1} min` };
    return { w: top, r: reps + 1, text: `EMOM 12 min × ${reps} réussie → reviens à 8 min avec ${reps + 1} reps par minute.`, apply: { sets: 8, target: String(reps + 1) }, label: `8 min × ${reps + 1}` };
  }
  const work = sets.filter(s => s.w === top).slice(0, it.sets);
  if (work.length < it.sets || work.some(s => s.r < range.hi)) return null;
  if (top === 0) {
    // Poids du corps en force (≤ 10 reps, ex. tractions 4–6, dips 6–10) : on leste et on repart du bas de la fourchette.
    // En endurance (pompes 15–25…), on ajoute des répétitions.
    if (range.hi <= 10) {
      const lest = db.settings.step;
      return { w: lest, r: range.lo, text: `${work.length} × ${range.hi}+ réussi au poids du corps → leste-toi de ${fmtNum(lest)} kg et repars à ${range.lo} reps (déjà pré-rempli). Pas de lest ? Vise ${range.hi + 1} reps.` };
    }
    return { w: 0, r: range.hi + 1, text: `${work.length} × ${range.hi}+ réussi au poids du corps → vise ${range.hi + 1} reps.` };
  }
  const w = round2(top + db.settings.step);
  return { w, r: range.lo, text: `${work.length} × ${range.hi}+ réussi à ${fmtNum(top)} kg → passe à ${fmtNum(w)} kg (vise ${range.lo} reps).` };
}
const lastSessionBefore = (exId, t) => {
  const before = setsOf(exId).filter(s => s.t < t);
  if (!before.length) return [];
  const day = dayKey(before[before.length - 1].t);
  return before.filter(s => dayKey(s.t) === day);
};

}
const nextWeek = wk => weekKey(wk + 7.5 * 864e5);

// Toutes les statistiques (badges, XP, défis) en un seul passage sur l'historique
function computeStats() {
  const sets = [...db.sets].sort((a, b) => a.t - b.t);
  const days = new Map(), best = new Map(), prIds = new Set();
  const st = { vol: 0, prs: 0, maxHold: 0, maxReps: 0, early: 0, night: 0 };
  for (const s of sets) {
    const k = kindOf(s.exId);
    const v = k === 'reps' ? s.w * s.r : 0;
    st.vol += v;
    const day = days.get(dayKey(s.t)) || { n: 0, vol: 0 };
    day.n++; day.vol += v;
    days.set(dayKey(s.t), day);
    if (k === 'reps') {
      st.maxReps = Math.max(st.maxReps, s.r);
      if (best.has(s.exId) && s.w > best.get(s.exId)) { st.prs++; prIds.add(s.id); }
      best.set(s.exId, Math.max(best.has(s.exId) ? best.get(s.exId) : 0, s.w));
    } else if (k === 's') st.maxHold = Math.max(st.maxHold, s.r);
    const h = new Date(s.t).getHours();
    if (h >= 4 && h < 8) st.early = 1;
    if (h >= 22 || h < 4) st.night = 1;
  }
  // Semaines actives (les semaines sauvées par un joker comptent)
  const weeks = [...new Set([...sets.map(s => weekKey(s.t)), ...db.jokersUsed])].sort((a, b) => a - b);
  const weekRun = new Map();
  let run = 0, prev = null;
  st.streak = 0;
  for (const w of weeks) {
    run = prev !== null && nextWeek(prev) === w ? run + 1 : 1;
    weekRun.set(w, run);
    st.streak = Math.max(st.streak, run);
    prev = w;
  }
  // Série en cours : compte encore si la dernière semaine active est celle-ci ou la précédente
  const now = weekKey(Date.now());
  st.curStreak = prev !== null && (prev === now || nextWeek(prev) === now) ? run : 0;
  st.mult = streakMult(st.curStreak);
  const dayVals = [...days.values()];
  st.sessions = days.size;
  st.dayVol = Math.max(0, ...dayVals.map(d => d.vol));
  st.daySets = Math.max(0, ...dayVals.map(d => d.n));
  st.runs = db.runs.length;
  st.progsDone = new Set(db.runs.map(r => r.progId)).size;
  st.prIds = prIds;
  st.lastWeek = prev;
  st.weekRun = weekRun;

  // XP
  const multAt = t => streakMult(weekRun.get(weekKey(t)) || 1);
  let xp = 0;
  for (const s of sets) xp += (XP.set + (prIds.has(s.id) ? XP.pr : 0)) * multAt(s.t);
  for (const r of db.runs) xp += XP.run * multAt(r.start);
  xp += XP.badge * Object.keys(db.badges).length;
  for (const ids of Object.values(db.challenges)) ids.forEach(id => { const c = challengeById(id); if (c) xp += c.xp; });
  st.xp = Math.round(xp);
  let level = 1;
  while (st.xp >= xpTotalFor(level + 1)) level++;
  st.level = level;
  st.into = st.xp - xpTotalFor(level);
  st.need = xpTotalFor(level + 1) - xpTotalFor(level);
  st.jokers = Math.max(0, Math.floor(level / JOKER_EVERY) - db.jokersUsed.length);
  return st;
}

// Chiffres d'une semaine pour les défis
function weekStats(wk, st) {
  const sets = db.sets.filter(s => weekKey(s.t) === wk);
  const runs = db.runs.filter(r => weekKey(r.start) === wk);
  const ws = { sessions: new Set(sets.map(s => dayKey(s.t))).size, sets: sets.length, reps: 0, vol: 0, holdSec: 0,
    prs: sets.filter(s => st.prIds.has(s.id)).length, variety: new Set(sets.map(s => s.exId)).size,
    runs: runs.length, progs: new Set(runs.map(r => r.progId)).size };
  for (const s of sets) {
    const k = kindOf(s.exId);
    if (k === 'reps') { ws.reps += s.r; ws.vol += s.w * s.r; }
    else ws.holdSec += s.r * (k === 'min' ? 60 : 1);
  }
  return ws;
}

// Enregistre les badges nouvellement obtenus. Sans célébration (chargement, import),
// ils sont datés à 1 pour ne pas apparaître comme « gagnés aujourd'hui ».
function syncBadges(celebrate) {
  const st = computeStats();
  const fresh = BADGES.filter(b => st[b.key] >= b.goal && !db.badges[b.id]);
  fresh.forEach(b => { db.badges[b.id] = celebrate ? Date.now() : 1; });
  return fresh;
}

function syncChallenges() {
  const st = computeStats();
  const wk = weekKey(Date.now());
  const ws = weekStats(wk, st);
  const done = db.challenges[wk] || [];
  const fresh = challengesFor(wk).filter(c => ws[c.key] >= c.goal && !done.includes(c.id));
  if (fresh.length) db.challenges[wk] = done.concat(fresh.map(c => c.id));
  return fresh;
}

// Une semaine ratée est couverte par un joker, si la série en valait la peine (2 semaines ou plus)
function useJokers() {
  const st = computeStats();
  if (st.lastWeek === null) return 0;
  const now = weekKey(Date.now());
  const gap = [];
  for (let w = nextWeek(st.lastWeek); w < now; w = nextWeek(w)) gap.push(w);
  if (!gap.length || gap.length > st.jokers || (st.weekRun.get(st.lastWeek) || 0) < 2) return 0;
  db.jokersUsed.push(...gap);
  return gap.length;
}

function rewardsAt(L) {
  const r = [];
  AVATARS.filter(a => a[2] === L).forEach(a => r.push(`${a[0]} Avatar ${a[1]}`));
  TITLES.filter(a => a[2] === L).forEach(a => r.push(`🏷️ Titre « ${a[1]} »`));
  THEMES.filter(a => a[2] === L).forEach(a => r.push(`🎨 Thème ${a[1]}`));
  EFFECTS.filter(a => a[2] === L && a[0] !== 'none').forEach(a => r.push(`🎉 ${a[1]}`));
  if (L % JOKER_EVERY === 0) r.push('🃏 1 joker');
  return r;
}

// Synchronise badges, défis, jokers et niveau. Renvoie les messages à annoncer.
function syncProgress(celebrate) {
  const msgs = [];
  syncBadges(celebrate).forEach(b => msgs.push(`🏅 Badge débloqué : ${b.icon} ${b.name}`));
  syncChallenges().forEach(c => msgs.push(`🎯 Défi réussi : ${c.text} (+${c.xp} XP)`));
  const used = useJokers();
  const jokerMsg = `🃏 Joker utilisé : ta série de semaines est sauvée !`;
  if (used) msgs.push(jokerMsg);
  const st = computeStats();
  const before = db.level || 0;
  if (before && st.level > before) {
    const gained = [];
    for (let L = before + 1; L <= st.level; L++) gained.push(...rewardsAt(L));
    msgs.push(`⬆️ Niveau ${st.level} !${gained.length ? ' Débloqué : ' + gained.join(', ') : ''}`);
  }
  db.level = st.level;
  save();
  if (!celebrate) return used ? [jokerMsg] : [];
  if (msgs.length) vibrate([100, 60, 100, 60, 250]);
  return msgs;
}

// Choix du profil : la valeur choisie si elle est débloquée, sinon la meilleure débloquée
function equipped(list, choice, level) {
  const open = list.filter(x => x[2] <= level);
  return (open.find(x => x[0] === choice) || open[open.length - 1])[0];
}
function profile(st) {
  const p = db.profile, L = st.level;
  return { theme: equipped(THEMES, p.theme || 'blue', L), avatar: equipped(AVATARS, p.avatar, L),
    title: equipped(TITLES, p.title, L), effect: equipped(EFFECTS, p.effect, L) };
}
function applyTheme() {
  const t = profile(computeStats()).theme;
  if (t === 'blue') delete document.documentElement.dataset.accent;
  else document.documentElement.dataset.accent = t;
}

// ---------- Célébrations (confettis, feu d'artifice, pluie d'or) ----------
function celebrate(kind) {
  kind = kind || profile(computeStats()).effect;
  if (kind === 'none') return;
  try { if (matchMedia('(prefers-reduced-motion: reduce)').matches) return; } catch (e) {}
  const c = document.createElement('canvas');
  c.className = 'fx';
  const dpr = window.devicePixelRatio || 1, W = innerWidth, H = innerHeight;
  c.width = W * dpr; c.height = H * dpr;
  document.body.appendChild(c);
  const g = c.getContext('2d');
  g.scale(dpr, dpr);
  const accent = getComputedStyle(document.documentElement).getPropertyValue('--accent').trim() || '#4aa8ff';
  const colors = kind === 'gold' ? ['#ffd700', '#f5c542', '#fff3b0', '#e6a800'] : [accent, '#ffc542', '#ff6b6b', '#3ddc84', '#b197fc', '#ffffff'];
  const parts = [];
  const rnd = (a, b) => a + Math.random() * (b - a);
  const pick = a => a[Math.floor(Math.random() * a.length)];
  if (kind === 'confetti') {
    for (let i = 0; i < 140; i++) parts.push({ x: rnd(0, W), y: rnd(-H * 0.4, -10), vx: rnd(-1.5, 1.5), vy: rnd(2, 5), g: 0.05, rot: rnd(0, 6), vr: rnd(-0.2, 0.2), w: rnd(6, 10), h: rnd(4, 7), c: pick(colors), shape: 'rect', delay: 0 });
  } else if (kind === 'fireworks') {
    for (let b = 0; b < 5; b++) {
      const cx = rnd(W * 0.15, W * 0.85), cy = rnd(H * 0.15, H * 0.45), col = pick(colors), delay = b * 18;
      for (let i = 0; i < 60; i++) {
        const a = rnd(0, Math.PI * 2), sp = rnd(1.5, 5);
        parts.push({ x: cx, y: cy, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, g: 0.05, w: 3, c: col, shape: 'dot', delay, fade: true });
      }
    }
  } else {
    for (let i = 0; i < 160; i++) parts.push({ x: rnd(0, W), y: rnd(-H * 0.6, -10), vx: rnd(-0.4, 0.4), vy: rnd(1.5, 3.5), g: 0.02, w: rnd(2, 5), c: pick(colors), shape: 'star', delay: 0, tw: rnd(0, 6) });
  }
  let frame = 0;
  const total = 150;
  (function step() {
    g.clearRect(0, 0, W, H);
    for (const p of parts) {
      if (frame < p.delay) continue;
      p.vy += p.g; p.x += p.vx; p.y += p.vy;
      if (p.vr) p.rot += p.vr;
      const life = 1 - (frame - p.delay) / (total - p.delay);
      g.globalAlpha = p.fade ? Math.max(0, life) : Math.min(1, life * 3);
      g.fillStyle = p.c;
      if (p.shape === 'rect') {
        g.save(); g.translate(p.x, p.y); g.rotate(p.rot); g.fillRect(-p.w / 2, -p.h / 2, p.w, p.h); g.restore();
      } else {
        const r = p.shape === 'star' ? p.w * (0.6 + 0.4 * Math.abs(Math.sin(frame / 6 + p.tw))) : p.w;
        g.beginPath(); g.arc(p.x, p.y, r, 0, Math.PI * 2); g.fill();
      }
    }
    if (++frame < total) requestAnimationFrame(step);
    else c.remove();
  })();
}

function vibrate(p) { try { navigator.vibrate && navigator.vibrate(p); } catch (e) {} }

const ui = { tab: db.active ? 'programmes' : 'seance', exId: null, editProg: null, summary: null, badges: false, rewards: false, emom: null, test: false, chrono: null, search: '', w: 0, r: 10, progEx: null, alerted: null };

function render() {
  updateWakeLock();
  document.querySelectorAll('nav button').forEach(b => {
    if (b.dataset.tab === ui.tab) b.setAttribute('aria-current', 'page');
    else b.removeAttribute('aria-current');

// Liste des exercices
function viewPicker() {
  setTitle('Séance');
  const today = todayKey();
  const q = ui.search.trim().toLowerCase();
  const info = db.exercises.map(ex => {
    const sets = setsOf(ex.id);
    const last = sets[sets.length - 1];
    const todayCount = sets.filter(s => dayKey(s.t) === today).length;
    return { ex, last, todayCount };
  });
  const filtered = info.filter(i => !q || norm(i.ex.name).includes(norm(q)));
  filtered.sort((a, b) => (b.todayCount > 0) - (a.todayCount > 0)
    || (b.last ? b.last.t : 0) - (a.last ? a.last.t : 0)
    || a.ex.name.localeCompare(b.ex.name, 'fr'));
  const exact = db.exercises.some(e => norm(e.name) === norm(q));

  const rows = filtered.map(({ ex, last, todayCount }) => {
    let sub = 'Jamais fait';
    if (todayCount) sub = 'Aujourd’hui · dernière série ' + fmtSet(last);
    else if (last) sub = relDay(dayKey(last.t)) + ' · ' + fmtSet(last);
    return `<button class="row" data-act="open" data-id="${ex.id}">
      <div class="grow"><div class="title">${esc(ex.name)}</div><div class="sub">${esc(sub)}</div></div>
      ${todayCount ? `<span class="badge">${todayCount}</span>` : ''}
      <span class="chev">›</span></button>`;
  }).join('');

  const todayTotal = db.sets.filter(s => dayKey(s.t) === today).length;
  $('#app').innerHTML = `
    <input class="search" id="search" type="search" placeholder="Chercher ou ajouter un exercice…" value="${esc(ui.search)}" autocomplete="off">
    ${todayTotal ? `<div class="section-title">Aujourd’hui : ${todayTotal} série${todayTotal > 1 ? 's' : ''}</div>` : ''}

      ${q && !exact ? `<button class="row add" data-act="create">+ Ajouter « ${esc(ui.search.trim())} »</button>` : ''}
      ${rows || (!q ? '<div class="empty">Aucun exercice</div>' : '')}

}

// Saisie des séries pour un exercice (séance libre ou programme)
function viewExercise() {
  const ex = exById(ui.exId);
  if (!ex) { ui.exId = null; return render(); }
  setTitle(ex.name);
  const ctx = progCtx();
  const kind = ex.kind || 'reps';
  const today = todayKey();
  const sessions = sessionsOf(ex.id);
  const todaySets = sessions.length && sessions[sessions.length - 1].day === today ? sessions[sessions.length - 1].sets : [];
  const shown = ctx ? runSets(ex.id) : todaySets;
  const prev = sessions.filter(s => s.day !== today).pop();
  const prevMax = Math.max(0, ...db.sets.filter(s => s.exId === ex.id).map(s => s.w));

  const emom = ctx && ctx.item.mode === 'emom';
  const targetLine = ctx ? `
    <div class="target">Objectif : <b>${emom ? `EMOM ${ctx.item.sets} min · ${esc(ctx.item.target)} reps par minute` : `${ctx.item.sets} × ${esc(ctx.item.target)}`}</b>${ctx.item.rest ? ' · repos ' + esc(ctx.item.rest) : ''}</div>
    ${ctx.item.tip ? `<div class="tip">💡 ${esc(ctx.item.tip)}</div>` : ''}` : '';
  const sug = !shown.length && prev ? suggestFor(ex.id, prev.sets) : null;
  const lastLine = prev
    ? `<div class="last">Dernière fois (${esc(relDay(prev.day))}) : <b>${fmtSets(prev.sets)}</b></div>`
    : `<div class="last">Première fois sur cet exercice 💪</div>`;

  // Record : première série atteignant le poids max (pas sur la toute première séance)
  let recordId = null;
  if (prevMax > 0) {
    const first = db.sets.filter(s => s.exId === ex.id && s.w === prevMax).sort((a, b) => a.t - b.t)[0];
    if (first && db.sets.some(s => s.exId === ex.id && dayKey(s.t) !== dayKey(first.t) && s.t < first.t)) recordId = first.id;
  }

  const setsHtml = shown.map((s, i) => `
    <div class="set">
      <span class="n">${i + 1}</span>
      <span class="v" data-act="reuse" data-id="${s.id}">${esc(fmtSetLong(s))}${s.id === recordId ? '<span class="pr">🏆 RECORD</span>' : ''}</span>
      <button class="x" data-act="del" data-id="${s.id}" aria-label="Supprimer">✕</button>
    </div>`).join('');

  const n = shown.length + 1;

  if (ui.test && kind === 'reps') {
    const tests = setsOf(ex.id).filter(s => s.test);
    const lastTest = tests[tests.length - 1];

    $('#app').innerHTML = `
      <div class="card">
        <h4>🎯 Test de max</h4>
        <div class="small muted">Échauffe-toi (quelques séries légères), repose-toi 3 min, puis fais <b>une seule série</b> avec le maximum de répétitions propres : amplitude complète, sans élan.</div>
        ${lastTest ? `<div class="small" style="margin-top:8px">Dernier test : <b>${esc(fmtSetLong(lastTest))}</b> (${esc(relDay(dayKey(lastTest.t)))})</div>` : ''}
        ${hasEmom ? '<div class="small" style="margin-top:6px">⚙️ Test au poids du corps : ton EMOM sera réglée sur environ un tiers de ce max.</div>' : ''}
      </div>
      <div class="card">
        <div class="steppers">
          <div class="stepper">
            <label for="w">Lest (kg) · 0 = poids du corps</label>
            <div class="ctrl">
              <button data-act="w-" aria-label="Moins de lest">−</button>
              <input id="w" inputmode="decimal" value="${fmtNum(ui.w)}" autocomplete="off">
              <button data-act="w+" aria-label="Plus de lest">+</button>
            </div>
          </div>
          <div class="stepper">
            <label for="r">Répétitions réussies</label>
            <div class="ctrl">
              <button data-act="r-" aria-label="Moins">−</button>
              <input id="r" inputmode="numeric" value="${ui.r}" autocomplete="off">
              <button data-act="r+" aria-label="Plus">+</button>

        <button class="primary" data-act="tsave">Enregistrer mon max</button>

    ${done && !emomRun ? `<button class="primary" data-act="next" style="margin-bottom:12px">${next ? 'Exercice suivant : ' + esc((exById(next.exId) || {}).name || '') + ' ›' : 'Dernier exercice fait ✓ Retour à la séance'}</button>` : ''}
    ${shown.length ? `<div class="section-title">${ctx ? 'Cette séance' : 'Aujourd’hui'}</div><div class="sets">${setsHtml}</div>` : ''}
    ${!ctx ? `<div class="small muted" style="margin:14px 4px 0">Astuce : mets 0 kg pour un exercice au poids du corps (PDC). Touche une série pour reprendre ses valeurs.</div>` : ''}
    ${kind === 'reps' && !running && !emomRun ? '<button class="link" data-act="ttest" style="margin:14px 4px 0">🎯 Faire un test de max</button>' : ''}`;
}

// Pré-remplit poids / répétitions avec les dernières valeurs connues
function prefill(id) {
  ui.test = false;
  const sets = setsOf(id).filter(s => !s.test);
  const last = sets[sets.length - 1];
  const ctx = progCtx();
  if (last) {
    // Reprendre la dernière série d'aujourd'hui, sinon la 1re de la séance précédente
    if (dayKey(last.t) === todayKey()) { ui.w = last.w; ui.r = last.r; }
    else {
      const prevDay = dayKey(last.t);
      const prevSets = sets.filter(s => dayKey(s.t) === prevDay);
      const sug = suggestFor(id, prevSets);
      if (sug) { ui.w = sug.w; ui.r = sug.r; }
      else { ui.w = prevSets[0].w; ui.r = prevSets[0].r; }
    }
  } else {
    ui.w = 0;
    ui.r = (ctx && firstNum(ctx.item.target)) || (kindOf(id) === 's' ? 30 : kindOf(id) === 'min' ? 10 : 10);
  }
  // En EMOM, les reps par minute viennent du programme (pas d'une autre séance)
  if (ctx && ctx.item.mode === 'emom') {
    const sug = last && dayKey(last.t) !== todayKey() ? suggestFor(id, sets.filter(s => dayKey(s.t) === dayKey(last.t))) : null;
    if (!(sug && sug.apply && runSets(id).length === 0)) ui.r = firstNum(ctx.item.target) || ui.r;
  }
}

function openExercise(id) {
  ui.exId = id;
  pushSub();
  prefill(id);
  render();
  window.scrollTo(0, 0);
}

function readInputs() {
  const w = $('#w'), r = $('#r');
  if (w) ui.w = Math.max(0, round2(num(w.value)));
  if (r) ui.r = Math.max(0, Math.round(num(r.value)));
}

function addSet() {
  readInputs();
  const kind = kindOf(ui.exId);
  if (kind !== 'reps') ui.w = 0;
  if (ui.r < 1) { toast(kind === 'reps' ? 'Indique le nombre de répétitions' : 'Indique la durée'); return; }
  recordSet(ui.exId, ui.w, ui.r);
}

function recordSet(exId, w, r, props) {
  const prevMax = Math.max(0, ...db.sets.filter(s => s.exId === exId).map(s => s.w));
  const hadSets = db.sets.some(s => s.exId === exId);
  const set = Object.assign({ id: uid(), exId, w, r, t: Date.now() }, props);
  db.sets.push(set);
  save();
  vibrate(30);
  const ctx = progCtx();
  const isPR = hadSets && w > prevMax;
  let msg = 'Série enregistrée ✓';
  if (set.test) msg = `🎯 Max enregistré : ${fmtW(w)} × ${r}`;
  else if (isPR) msg = '🏆 Nouveau record : ' + fmtW(w) + ' !';
  else if (ctx && ctx.item.exId === exId && runSets(exId).length === ctx.item.sets) msg = 'Exercice terminé ✓';
  const extra = syncProgress(true);
  if (extra.length) announce([msg, ...extra]); else toast(msg);
  render();
  if (isPR || extra.length) celebrate();
  return set;
}

// ---------- Chrono (gainage, killy, course…) ----------
let audioCtx = null;
function unlockAudio() {
  // Sur iPhone, le son doit être autorisé par un geste de l'utilisateur
  try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); audioCtx.resume(); } catch (e) {}
}
function beep(times, freq, len) {
  freq = freq || 880; len = len || 0.25;
  try {
    unlockAudio();
    for (let i = 0; i < times; i++) {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      const t0 = audioCtx.currentTime + i * 0.35;
      o.type = 'sine'; o.frequency.value = freq;
      g.gain.setValueAtTime(0.0001, t0);
      g.gain.exponentialRampToValueAtTime(0.6, t0 + 0.02);
      g.gain.exponentialRampToValueAtTime(0.0001, t0 + len);
      o.connect(g); g.connect(audioCtx.destination);
      o.start(t0); o.stop(t0 + len + 0.05);
    }
  } catch (e) {}
}
// Écran maintenu allumé pendant le chrono et, si le réglage est actif, pendant toute une séance de programme
let wakeLock = null, wakePending = false;
async function keepAwake(on) {
  try {
    if (on && !wakeLock && !wakePending && 'wakeLock' in navigator && !document.hidden) {
      wakePending = true;
      wakeLock = await navigator.wakeLock.request('screen');
      wakeLock.addEventListener('release', () => { wakeLock = null; });
    } else if (!on && wakeLock) { const w = wakeLock; wakeLock = null; await w.release(); }
  } catch (e) {} finally { wakePending = false; }
  // L'état a pu changer pendant la demande
  if (on !== wantAwake()) updateWakeLock();
}
const wantAwake = () => !!ui.chrono || !!ui.emom || (!!db.active && db.settings.awake);
function updateWakeLock() { keepAwake(wantAwake()); }
const unitSec = exId => kindOf(exId) === 'min' ? 60 : 1;
function startChrono() {
  readInputs();
  if (ui.r < 1) { toast('Indique la durée'); return; }
  unlockAudio();
  ui.chrono = { exId: ui.exId, start: Date.now(), dur: ui.r * unitSec(ui.exId), planned: ui.r };
  updateWakeLock(); vibrate(30); render();
}
function stopChrono(record) {
  const c = ui.chrono;
  if (!c) return;
  ui.chrono = null; updateWakeLock();
  if (!record) { render(); return; }
  const elapsed = Math.min(c.dur, (Date.now() - c.start) / 1000);
  const r = Math.round(elapsed / unitSec(c.exId));
  if (r < 1) { toast('Trop court : série non notée'); render(); return; }
  recordSet(c.exId, 0, r);
}
function tickChrono() {
  const c = ui.chrono;
  if (!c) return;
  const left = c.dur - (Date.now() - c.start) / 1000;
  if (left <= 0) {
    beep(3); vibrate([300, 150, 300]);
    ui.chrono = null; updateWakeLock();
    recordSet(c.exId, 0, c.planned);
    return;
  }
  const el = $('#chronoLeft'), bar = $('#chronoBar');
  if (el) el.textContent = mmss(Math.ceil(left));
  if (bar) bar.style.width = (100 - left / c.dur * 100).toFixed(1) + '%';
}
setInterval(tickChrono, 250);

// EMOM : une série au début de chaque minute, notée automatiquement à la fin de la minute.
// Trois petits bips (3-2-1) annoncent chaque nouvelle minute, puis un bip plus long donne le départ.
const EMOM_LEAD = 5;
function startEmom() {
  readInputs();
  const ctx = progCtx();
  if (!ctx || ui.r < 1) { toast('Indique le nombre de répétitions'); return; }
  unlockAudio();
  // 5 s pour se placer sous la barre ; la minute 1 démarre ensuite
  ui.emom = { exId: ui.exId, start: Date.now() + EMOM_LEAD * 1000, minutes: ctx.item.sets, reps: ui.r, w: ui.w, logged: 0, beeped: -1, cd: null };
  vibrate(30);
  updateWakeLock(); render();
}
function stopEmom() {
  const e = ui.emom;
  if (!e) return;
  ui.emom = null; updateWakeLock(); render();
  toast(`EMOM arrêtée : ${e.logged} minute${e.logged > 1 ? 's' : ''} notée${e.logged > 1 ? 's' : ''}`);
}
function tickEmom() {
  const e = ui.emom;
  if (!e) return;
  const el = (Date.now() - e.start) / 1000;
  const done = Math.min(e.minutes, Math.floor(el / 60));
  while (e.logged < done) {
    e.logged++;
    if (e.logged === e.minutes) ui.emom = null; // dernière minute : on sort avant de noter pour afficher la fin
    recordSet(e.exId, e.w, e.reps);
  }
  if (!ui.emom) {
    beep(3); vibrate([300, 150, 300]); updateWakeLock(); render();
    announce([`EMOM terminée 💪 ${e.minutes} × ${e.reps}`]);
    return;
  }
  // Départ de chaque nouvelle minute (pas si l'app revient d'une longue pause)
  if (done > e.beeped) { e.beeped = done; if (el - done * 60 < 2) { beep(1, 988, 0.4); vibrate(200); } }
  // 3-2-1 avant la prochaine minute (sauf après la dernière)
  const toNext = (done + 1) * 60 - el, sec = Math.ceil(toNext);
  if (done + 1 < e.minutes && sec >= 1 && sec <= 3 && e.cd !== `${done}:${sec}`) {
    e.cd = `${done}:${sec}`;
    if (sec - toNext < 0.5) beep(1, 660, 0.12);
  }
  const m = $('#emomMin'), left = $('#emomLeft'), bar = $('#emomBar');
  if (m) m.textContent = el < 0 ? 'Prépare-toi…' : `Minute ${done + 1} / ${e.minutes}`;
  if (left) left.textContent = mmss(Math.max(1, sec));
  if (bar) bar.style.width = (Math.max(0, el) / (e.minutes * 60) * 100).toFixed(1) + '%';
}
setInterval(tickEmom, 250);
// Le téléphone relâche le verrou quand l'app passe en arrière-plan : on le reprend au retour
document.addEventListener('visibilitychange', () => { if (!document.hidden) updateWakeLock(); });

function launch(id) {
  const p = progById(id);
  if (!p || !p.items.length) { toast('Ajoute d’abord des exercices à ce programme'); return; }
  db.active = { progId: id, start: Date.now(), xpStart: computeStats().xp };
  save();
  openExercise(p.items[0].exId);
}

function finishRun() {
  const p = progById(db.active.progId);
  const count = db.sets.filter(s => s.t >= db.active.start).length;
  const total = p.items.reduce((a, it) => a + it.sets, 0);
  const done = p.items.reduce((a, it) => a + Math.min(runSets(it.exId).length, it.sets), 0);
  if (done < total && !confirm(`Il reste ${total - done} série(s) prévue(s). Terminer quand même ?`)) return;
  const start = db.active.start, xpStart = db.active.xpStart;
  const end = Math.max(start, ...db.sets.filter(s => s.t >= start).map(s => s.t));
  db.active = null;
  if (count) {
    p.lastDone = Date.now();
    db.runs.push({ progId: p.id, start, end });
    const extra = syncProgress(true);
    const xpGain = xpStart == null ? null : Math.max(0, computeStats().xp - xpStart);
    ui.summary = { progId: p.id, start, end, finished: true, badgeTo: Date.now(), xpGain };
    pushSub();
    if (extra.length) { announce(extra); setTimeout(() => celebrate(), 200); }
  }
  save();
  render(); window.scrollTo(0, 0);
  if (!count) toast('Séance terminée');
}

// Résumé d'une séance : chiffres, records, comparaison avec la fois d'avant
function viewSummary() {
  const sm = ui.summary;
  setTitle('Résumé');
  const inRange = (s, a, b) => s.t >= a && s.t <= b;
  const sets = db.sets.filter(s => inRange(s, sm.start, sm.end)).sort((a, b) => a.t - b.t);
  const volOf = list => Math.round(list.reduce((a, s) => a + (kindOf(s.exId) === 'reps' ? s.w * s.r : 0), 0));
  const fmtDur = ms => { const m = Math.round(ms / 60000); return m < 60 ? m + ' min' : Math.floor(m / 60) + ' h ' + String(m % 60).padStart(2, '0'); };
  const cur = { n: sets.length, vol: volOf(sets), dur: sm.end - sm.start };

  // Comparaison avec la séance précédente du même programme
  let prev = null;
  if (sm.progId) {
    const pr = db.runs.filter(r => r.progId === sm.progId && r.start < sm.start).pop();
    if (pr) {
      const ps = db.sets.filter(s => inRange(s, pr.start, pr.end));
      prev = { n: ps.length, vol: volOf(ps), dur: pr.end - pr.start };
    }
  }
  const delta = (a, b, fmt) => {
    if (!prev) return '';
    const d = a - b;
    if (!d) return '<div class="delta">= dernière fois</div>';
    return `<div class="delta ${d > 0 ? 'up' : 'down'}">${d > 0 ? '+' : '−'}${fmt(Math.abs(d))} vs dernière fois</div>`;
  };
  const deltaDur = () => {
    if (!prev) return '';
    const d = Math.round((cur.dur - prev.dur) / 60000);
    return `<div class="delta">${d === 0 ? '= dernière fois' : (d > 0 ? '+' : '−') + Math.abs(d) + ' min'}</div>`;
  };

  // Détail par exercice
  const order = [...new Set(sets.map(s => s.exId))];
  const better = (a, b) => a.w !== b.w ? a.w - b.w : a.r - b.r;
  const best = list => list.reduce((m, s) => (!m || better(s, m) > 0 ? s : m), null);
  const records = [], suggestions = [];
  const exHtml = order.map(exId => {
    const ex = exById(exId);
    const mine = sets.filter(s => s.exId === exId);
    const before = lastSessionBefore(exId, sm.start);
    const prevMax = Math.max(0, ...setsOf(exId).filter(s => s.t < sm.start).map(s => s.w));
    const myMax = Math.max(...mine.map(s => s.w));
    if (before.length && prevMax > 0 && myMax > prevMax) records.push(`${ex ? ex.name : '?'} : ${fmtW(myMax)} (avant ${fmtW(prevMax)})`);
    const sug = suggestFor(exId, mine);
    if (sug) suggestions.push(`${ex ? ex.name : '?'} : ${sug.text}`);
    let arrow = '';
    if (before.length) {
      const c = better(best(mine), best(before));
      arrow = c > 0 ? '<span class="arrow up">↑</span>' : c < 0 ? '<span class="arrow down">↓</span>' : '<span class="arrow">=</span>';
    }
    return `<div class="ex"><div class="name">${esc(ex ? ex.name : 'Exercice supprimé')}${arrow}</div>
      <div class="detail">${fmtSets(mine)}</div>
      ${before.length ? `<div class="small muted">Avant (${esc(relDay(dayKey(before[0].t)))}) : ${fmtSets(before)}</div>` : ''}</div>`;
  }).join('');

  const p = sm.progId && progById(sm.progId);
  const badgeTo = sm.badgeTo || sm.end + 60e3;
  const won = BADGES.filter(b => db.badges[b.id] >= sm.start && db.badges[b.id] <= badgeTo);
  $('#app').innerHTML = `
    <div class="card hero">
      <div class="big">${sm.finished ? '💪' : '📋'}</div>
      <div class="title">${sm.finished ? 'Séance terminée !' : esc(p ? p.name : 'Résumé de la journée')}</div>
      <div class="small muted">${sm.finished && p ? esc(p.name) + ' · ' : ''}${esc(fmtDay(dayKey(sm.start)))}</div>
      ${sm.xpGain != null ? (() => { const st = computeStats(); return `
        <div class="xp-gain">+${fmtNum(sm.xpGain)} XP</div>
        <div class="xpbar"><div style="width:${Math.round(st.into / st.need * 100)}%"></div></div>
        <div class="small muted">Niveau ${st.level} · ${fmtNum(st.into)} / ${fmtNum(st.need)} XP${st.mult > 1 ? ' · 🔥 bonus ×' + fmtNum(st.mult) : ''}</div>`; })() : ''}
    </div>
    <div class="stats">
      <div class="stat"><div class="k">Durée</div><div class="val">${fmtDur(cur.dur)}</div>${deltaDur()}</div>
      <div class="stat"><div class="k">Séries</div><div class="val">${cur.n}</div>${delta(cur.n, prev && prev.n, String)}</div>
      <div class="stat"><div class="k">Volume (kg)</div><div class="val">${fmtNum(cur.vol)}</div>${delta(cur.vol, prev && prev.vol, fmtNum)}</div>
    </div>
    ${records.length ? `<div class="card"><b>🏆 Record${records.length > 1 ? 's' : ''} battu${records.length > 1 ? 's' : ''}</b><ul>${records.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
    ${won.length ? `<div class="card"><b>🏅 Badge${won.length > 1 ? 's' : ''} débloqué${won.length > 1 ? 's' : ''}</b><ul>${won.map(b => `<li>${b.icon} <b>${esc(b.name)}</b> — ${esc(b.desc)}</li>`).join('')}</ul></div>` : ''}
    ${suggestions.length ? `<div class="card"><b>📈 Pour la prochaine fois</b><ul>${suggestions.map(r => `<li>${esc(r)}</li>`).join('')}</ul></div>` : ''}
    <div class="section-title">Exercices</div>
    <div class="card day">${exHtml}</div>
    <button class="primary" data-act="sumclose">OK</button>`;
}

// Historique par jour
function viewHistory() {

  if (!db.sets.length) {
    $('#app').innerHTML = `<div class="empty"><div class="big">📅</div>Tes séances apparaîtront ici.</div>`;
    return;
  }
  const days = new Map();
  for (const s of [...db.sets].sort((a, b) => a.t - b.t)) {
    const k = dayKey(s.t);
    if (!days.has(k)) days.set(k, new Map());
    const exMap = days.get(k);
    if (!exMap.has(s.exId)) exMap.set(s.exId, []);
    exMap.get(s.exId).push(s);
  }
  const html = [...days.entries()].reverse().map(([day, exMap]) => {
    let total = 0, volume = 0;
    const exHtml = [...exMap.entries()].map(([exId, sets]) => {
      total += sets.length;
      if (kindOf(exId) === 'reps') sets.forEach(s => volume += s.w * s.r);
      const ex = exById(exId);
      return `<div class="ex"><div class="name">${esc(ex ? ex.name : 'Exercice supprimé')}</div>
        <div class="detail">${fmtSets(sets)}</div></div>`;
    }).join('');
    return `<div class="card day">
      <h3>${esc(fmtDay(day))}</h3>
      <div class="small muted" style="margin:-4px 0 10px">${total} série${total > 1 ? 's' : ''}${volume ? ' · ' + fmtNum(Math.round(volume)) + ' kg soulevés' : ''}</div>
      ${exHtml}
      <button class="link" data-act="daysum" data-day="${day}" style="margin-top:6px">Voir le résumé ›</button></div>`;
  }).join('');
  $('#app').innerHTML = html;
}

function chart(pts) {
  if (pts.length < 2) return `<div class="small muted" style="padding:20px 0;text-align:center">Il faut au moins 2 séances pour tracer la courbe.</div>`;
  const W = 320, H = 160, L = 34, R = 10, T = 10, B = 24;
  let min = Math.min(...pts.map(p => p.v)), max = Math.max(...pts.map(p => p.v));
  if (min === max) { min -= 5; max += 5; }
  const pad = (max - min) * 0.1; min = Math.max(0, min - pad); max += pad;
  const x = i => L + (W - L - R) * (i / (pts.length - 1));
  const y = v => T + (H - T - B) * (1 - (v - min) / (max - min));
  const path = pts.map((p, i) => (i ? 'L' : 'M') + x(i).toFixed(1) + ' ' + y(p.v).toFixed(1)).join(' ');
  const ticks = [min, (min + max) / 2, max];
  const short = d => fmtDay(d, { day: 'numeric', month: 'short' });
  return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Courbe de progression">
    ${ticks.map(v => `<line class="grid" x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/><text x="${L - 6}" y="${y(v) + 3}" text-anchor="end">${Math.round(v)}</text>`).join('')}
    <path class="line" d="${path}"/>
    ${pts.length <= 40 ? pts.map((p, i) => `<circle class="dot" cx="${x(i)}" cy="${y(p.v)}" r="3"/>`).join('') : ''}
    <text x="${L}" y="${H - 6}">${esc(short(pts[0].day))}</text>
    <text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(short(pts[pts.length - 1].day))}</text>
  </svg>`;
}

async function exportData() {
  const json = JSON.stringify(db, null, 2);
  const name = 'muscu-sauvegarde-' + todayKey() + '.json';
  const file = new File([json], name, { type: 'application/json' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: 'Sauvegarde Muscu' });
      return;
    }
  } catch (e) { if (e && e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 5000);
}

function importData(file) {
  const reader = new FileReader();
  reader.onload = () => {
    try {
      const d = JSON.parse(reader.result);
      if (!d || !Array.isArray(d.exercises) || !Array.isArray(d.sets)) throw new Error('format');
      if (!confirm(`Remplacer tes données actuelles par cette sauvegarde (${d.sets.length} séries) ?`)) return;
      db = migrate(d); syncProgress(false); applyTheme(); save(); ui.exId = null; ui.editProg = null; ui.summary = null; ui.badges = false; ui.progEx = null;
      toast('Sauvegarde importée ✓'); render();
    } catch (e) { alert('Ce fichier n’est pas une sauvegarde Muscu valide.'); }
  };
  reader.readAsText(file);
}

// ---------- Chrono de repos ----------
// Pendant un programme : compte à rebours selon le repos prévu, vibre à la fin.
// Sinon : temps écoulé depuis la dernière série.
function updateTimer() {
  const el = $('#timer');
  const last = db.sets.reduce((m, s) => (!m || s.t > m.t ? s : m), null);
  const sec = last ? Math.floor((Date.now() - last.t) / 1000) : 0;
  if (!last || sec > 15 * 60 || (ui.tab !== 'seance' && ui.tab !== 'programmes') || ui.editProg || ui.summary || ui.chrono || ui.emom) { el.hidden = true; return; }
  let rest = 0;
  if (db.active && last.t >= db.active.start) {
    const p = progById(db.active.progId);
    const it = p && p.items.find(i => i.exId === last.exId);
    rest = it ? parseRest(it.rest) : 0;
  }
  el.hidden = false;
  if (rest && sec < rest) {
    el.classList.remove('ready');
    el.textContent = '⏳ Repos ' + mmss(rest - sec);
  } else if (rest) {
    el.classList.add('ready');
    el.textContent = '✅ Go ! +' + mmss(sec - rest);
    if (ui.alerted !== last.id) {
      ui.alerted = last.id;
      if (sec - rest < 5) {
        vibrate([300, 150, 300]);
        if (db.settings.sound) beep(2);
      }
    }
  } else {
    el.classList.remove('ready');
    el.textContent = '⏱ ' + mmss(sec);
  }
}
setInterval(updateTimer, 1000);

    const it = p.items[+t.dataset.i];
    if (t.value === 'emom') {
      Object.assign(it, { mode: 'emom', sets: 8, target: String(Math.max(1, Math.floor(firstNum(it.target) / 2)) || 3), rest: '' });
    } else { delete it.mode; Object.assign(it, { sets: 3, target: '8–12', rest: '90 s' }); }
    save(); render();
  }
  if (t.dataset.if === 'sets') render(); // corrige l'affichage si la saisie était invalide
  if (t.id === 'addItem' && t.value) {
    let exId = t.value;
    if (exId === '__new') {
      const name = (prompt('Nom du nouvel exercice :') || '').trim();
      if (!name) { t.value = ''; return; }
      exId = findOrCreateEx(db, name).id;
    }
    p.items.push({ exId, sets: 3, target: '8–12', rest: '90 s', tip: '' });
    save(); render();
    window.scrollTo(0, document.body.scrollHeight);
  }
});

$('#app').addEventListener('focusin', e => {
  if (e.target.id === 'w' || e.target.id === 'r') setTimeout(() => e.target.select(), 0);
});

$('#app').addEventListener('keydown', e => {
  if (e.key !== 'Enter') return;
  if (e.target.id === 'search') {
    const first = $('#app .row');
    if (first) first.click();
  } else if (e.target.id === 'w' || e.target.id === 'r') {
    e.target.blur(); addSet();
  }
});

$('#app').addEventListener('click', e => {
  const t = e.target.closest('[data-act]');
  if (!t) return;
  const act = t.dataset.act, id = t.dataset.id;
  const p = ui.editProg && progById(ui.editProg);
  const i = +t.dataset.i;
  switch (act) {
    case 'open': ui.search = ''; openExercise(id); break;
    case 'create': {
      const name = ui.search.trim();
      if (!name) return;
      const ex = findOrCreateEx(db, name);
      save();
      ui.search = ''; openExercise(ex.id);
      break;
    }
    case 'w-': case 'w+': {
      readInputs();
      const st = db.settings.step;
      ui.w = act === 'w+' ? round2(ui.w + st) : Math.max(0, round2(ui.w - st));
      $('#w').value = fmtNum(ui.w); vibrate(10);
      break;
    }
    case 'r-': case 'r+': {
      readInputs();
      const st = kindOf(ui.exId) === 's' ? 5 : 1;
      ui.r = act === 'r+' ? ui.r + st : Math.max(0, ui.r - st);
      $('#r').value = ui.r; vibrate(10);
      break;
    }
    case 'add': unlockAudio(); addSet(); break;
    case 'cstart': startChrono(); break;
    case 'estart': startEmom(); break;
    case 'ttest': {
      const tests = setsOf(ui.exId).filter(s => s.test);
      const last = tests[tests.length - 1];
      ui.test = true;
      ui.w = last ? last.w : 0;
      const bw = setsOf(ui.exId).filter(s => s.w === 0).map(s => s.r);
      ui.r = last ? last.r : bw.length ? Math.max(...bw) : 10;
      render(); window.scrollTo(0, 0);
      break;
    }
    case 'tcancel': prefill(ui.exId); render(); break;
    case 'tsave': {
      readInputs();
      if (ui.r < 1) { toast('Indique le nombre de répétitions'); break; }
      const set = recordSet(ui.exId, ui.w, ui.r, { test: true });
      // Test au poids du corps : les EMOM de cet exercice passent à ~1/3 du max
      const msgs = [];
      if (set.w === 0) {
        const reps = Math.max(1, Math.round(set.r / 3));
        db.programs.forEach(pr => pr.items.forEach(it => {
          if (it.exId === set.exId && it.mode === 'emom' && it.target !== String(reps)) {
            it.target = String(reps);
            msgs.push(`⚙️ ${pr.name.split(' — ')[0]} : EMOM réglée sur ${reps} reps par minute`);
          }
        }));
      }
      save();
      prefill(ui.exId); render();
      if (msgs.length) announce(msgs);
      break;
    }
    case 'estop': if (confirm('Arrêter l’EMOM ? Les minutes déjà faites restent notées.')) stopEmom(); break;
    case 'applysug': {
      const ctx = progCtx();
      const prevSets = lastSessionBefore(ui.exId, db.active ? db.active.start : Date.now());
      const sg = ctx && suggestFor(ui.exId, prevSets);
      if (sg && sg.apply) {
        Object.assign(ctx.item, sg.apply); save();
        ui.w = sg.w; ui.r = sg.r; render();
        toast('Programme mis à jour : ' + sg.label + ' ✓');
      }
      break;
    }
    case 'cstop': stopChrono(true); break;
    case 'ccancel': stopChrono(false); break;
    case 'sumclose': $('#back').click(); break;
    case 'badges': ui.badges = true; pushSub(); render(); window.scrollTo(0, 0); break;
    case 'rewards': ui.rewards = true; pushSub(); render(); window.scrollTo(0, 0); break;
    case 'pick': {
      const lv = +t.dataset.lv;
      if (lv > computeStats().level) { toast('🔒 Se débloque au niveau ' + lv); break; }
      db.profile[t.dataset.kind] = t.dataset.v;
      save(); applyTheme(); render();
      if (t.dataset.kind === 'effect') celebrate(t.dataset.v);
      break;
    }
    case 'tryfx': celebrate(); break;
    case 'daysum': {
      const day = t.dataset.day;
      const list = db.sets.filter(s => dayKey(s.t) === day).sort((a, b) => a.t - b.t);
      const runs = db.runs.filter(r => dayKey(r.start) === day);
      const run = runs.length === 1 && list.every(s => s.t >= runs[0].start && s.t <= runs[0].end) && runs[0];
      ui.summary = run ? { progId: run.progId, start: run.start, end: run.end }
        : { progId: null, start: list[0].t, end: list[list.length - 1].t };
      pushSub(); render(); window.scrollTo(0, 0);
      break;
    }
    case 'next': {
      const ctx = progCtx();
      const nx = ctx && ctx.p.items[ctx.i + 1];
      if (nx) { ui.exId = nx.exId; prefill(nx.exId); render(); window.scrollTo(0, 0); }
      else $('#back').click();
      break;
    }
    case 'reuse': {
      const s = db.sets.find(x => x.id === id);
      if (s) { ui.w = s.w; ui.r = s.r; if ($('#w')) $('#w').value = fmtNum(s.w); $('#r').value = s.r; }
      break;
    }
    case 'del': {
      const s = db.sets.find(x => x.id === id);
      if (s && confirm('Supprimer la série ' + fmtSet(s) + ' ?')) {
        db.sets = db.sets.filter(x => x.id !== id); save(); render();
      }
      break;
    }
    case 'launch': launch(id); break;
    case 'finish': finishRun(); break;
    case 'cancelrun':
      if (confirm('Annuler la séance en cours ? Les séries déjà notées restent dans l’historique.')) {
        db.active = null; save(); render();
      }
      break;
    case 'pnew': {
      const np = { id: uid(), name: 'Nouveau programme', note: '', items: [] };
      db.programs.push(np); save();
      ui.editProg = np.id; pushSub(); render(); window.scrollTo(0, 0);
      break;
    }
    case 'pedit': ui.editProg = id; pushSub(); render(); window.scrollTo(0, 0); break;
    case 'pdone': $('#back').click(); break;
    case 'pdel':
      if (p && confirm(`Supprimer le programme « ${p.name} » ? Tes séries déjà notées sont conservées.`)) {
        db.programs = db.programs.filter(x => x.id !== p.id);
        if (db.active && db.active.progId === p.id) db.active = null;
        save(); $('#back').click();
      }
      break;
    case 'iup': case 'idown': {
      const j = act === 'iup' ? i - 1 : i + 1;
      if (p && j >= 0 && j < p.items.length) { [p.items[i], p.items[j]] = [p.items[j], p.items[i]]; save(); render(); }
      break;
    }
    case 'idel': if (p) { p.items.splice(i, 1); save(); render(); } break;
    case 'step': db.settings.step = Number(t.dataset.v); save(); render(); break;
    case 'awake': db.settings.awake = t.dataset.v === '1'; save(); render(); break;
    case 'sound':
      db.settings.sound = t.dataset.v === '1'; save(); render();
      if (db.settings.sound) { unlockAudio(); beep(2); }
      break;
    case 'export': exportData(); break;
    case 'import': $('#importFile').click(); break;
    case 'rename': {
      const ex = exById(id);
      const name = ex && prompt('Nouveau nom :', ex.name);
      if (name && name.trim()) { ex.name = name.trim(); save(); render(); }
      break;
    }
    case 'delex': {
      const ex = exById(id);
      const n = db.sets.filter(s => s.exId === id).length;
      if (ex && confirm(`Supprimer « ${ex.name} »${n ? ` et ses ${n} séries` : ''} ? Il sera aussi retiré des programmes.`)) {
        db.exercises = db.exercises.filter(e => e.id !== id);
        db.sets = db.sets.filter(s => s.exId !== id);
        db.programs.forEach(pr => { pr.items = pr.items.filter(it => it.exId !== id); });
        save(); render();
      }
      break;
    }
    case 'wipe':
      if (confirm('Effacer TOUTES tes séances, exercices et programmes ? Cette action est définitive.')) {
        db = freshDb(); save(); applyTheme(); ui.exId = null; ui.editProg = null; ui.summary = null; ui.badges = false; ui.rewards = false; ui.progEx = null; render(); toast('Données effacées');
      }
      break;
  }
});

$('#importFile').addEventListener('change', e => {
  const f = e.target.files[0];
  if (f) importData(f);
  e.target.value = '';
});

// Bouton retour Android / geste retour
window.addEventListener('popstate', () => { if (ui.exId || ui.editProg || ui.summary || ui.badges || ui.rewards) closeSub(); });

// Synchronisation si l'app est ouverte dans deux onglets
window.addEventListener('storage', e => { if (e.key === STORE_KEY) { db = load(); render(); } });

// Badges, défis et niveau déjà mérités avant cette version : sans fanfare
const startMsgs = syncProgress(false);
applyTheme();
render();
if (startMsgs.length) announce(startMsgs);

if ('serviceWorker' in navigator && location.protocol !== 'file:') {
  // Recharge une fois quand une nouvelle version de l'app vient d'être installée
  let hadController = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (hadController) location.reload();
    hadController = true;
  });
  navigator.serviceWorker.register('sw.js').catch(() => {});
}
</script>
</body>
